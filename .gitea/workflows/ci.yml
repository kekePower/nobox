name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build xvfb xterm x11-utils
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Check
        run: cmake --build --preset check
      - name: Test X11 integration
        run: cmake --build --preset dev --target test
