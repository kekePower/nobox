# nobox keeps its main configuration in one TOML file. Autostart remains a
# separate executable shell script at ~/.config/nobox/autostart.

[focus]
focus_new = true
# Focus clients as the pointer enters them. Disabled by default.
follow_mouse = false
# Reject stale application activations while allowing explicit pager/user requests.
prevent_focus_stealing = true
raise_on_focus = true

[switcher]
enabled = true
width = 420
row_height = 28
max_rows = 8

[menu]
width = 260
row_height = 26
# Overflow continues through explicit More... submenus instead of scrolling.
max_rows = 20
# Command-backed menus are killed if they do not finish within this bound.
command_timeout_ms = 1000

[panel]
# The panel is a separate optional process and is never required by the WM.
enabled = false
position = "bottom"
height = 30
background = "#1f2228"
foreground = "#f2f2f2"
active_background = "#4c78a8"
urgent_background = "#b84242"
padding = 4
spacing = 4
task_max_width = 220
task_scope = "current_workspace"
# Components are rendered from left to right. Spacer consumes unused room.
items = ["launchers", "workspaces", "tasks", "spacer", "clock"]
# Desktop-entry IDs such as "org.gnome.Terminal.desktop".
launchers = []
clock_format = "%H:%M"
show_workspaces = true
show_tasks = true
show_clock = true

[wayland]
# Start the optional XWayland compatibility server when it was built.
xwayland = false

# Optional compositor-authorized input method. The first item must be an
# absolute executable; no shell parsing is performed.
input_method = []

[commands]
# Standard actions refer to these commands instead of embedding executables in
# menus and bindings. The optional session command replaces the built-in XSMP
# logout path; use a dialog such as `ssdd` when it owns confirmation itself.
terminal = "xterm"
screenshot = "nobox-screenshot"
window_screenshot = "nobox-screenshot -w"
session = ""

[shortcuts]
# These common shortcuts are friendly aliases layered into the standard keymap.
# Super+Return remains the compact terminal shortcut.
terminal = "C-A-t"
screenshot = "Print"
window_screenshot = "A-Print"

