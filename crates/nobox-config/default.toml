# nobox keeps its main configuration in one TOML file. Autostart remains a
# separate executable shell script at ~/.config/nobox/autostart.

[focus]
focus_new = true
# Focus clients as the pointer enters them. Disabled by default.
follow_mouse = false
# Reject stale application activations while allowing explicit pager/user requests.
prevent_focus_stealing = true
raise_on_focus = true

[switcher]
enabled = true
width = 420
row_height = 28
max_rows = 8

[menu]
width = 260
row_height = 26
max_rows = 20

[[menu.definitions]]
id = "root"
title = "nobox"

[[menu.definitions.entries]]
type = "item"
label = "_Terminal"
action = { type = "execute", command = "xterm" }

[[menu.definitions.entries]]
type = "submenu"
label = "_Windows"
menu = "windows"

[[menu.definitions.entries]]
type = "submenu"
label = "_Session"
menu = "session"

[[menu.definitions]]
id = "windows"
title = "Windows"
source = "windows"

[[menu.definitions]]
id = "client"
title = "Window"
source = "client"

[[menu.definitions]]
id = "client-workspaces"
title = "Send to workspace"
source = "client_workspaces"

[[menu.definitions]]
id = "session"
title = "Session"

[[menu.definitions.entries]]
type = "item"
label = "_Reconfigure"
action = { type = "reconfigure" }

[[menu.definitions.entries]]
type = "item"
label = "_Restart nobox"
action = { type = "restart" }

[[menu.definitions.entries]]
type = "separator"

[[menu.definitions.entries]]
type = "item"
label = "_Exit nobox"
action = { type = "exit" }

[placement]
# Center inside a completely free smart-placement field, like Openbox.
center_free_space = true

[workspaces]
# The number of names is the number of workspaces.
names = ["1", "2", "3", "4"]
# Zero lays workspaces out in one row; set 2 for a 2x2 default grid.
columns = 0
wrap = true

[theme]
border_width = 2
titlebar_height = 24
active_border = "#8aadf4"
inactive_border = "#494d64"
urgent_border = "#ed8796"
active_titlebar = "#36394f"
inactive_titlebar = "#24273a"
urgent_titlebar = "#5b303b"
title_text = "#cad3f5"
minimize_button = "#eed49f"
maximize_button = "#a6da95"
close_button = "#ed8796"

[mouse]
# Super + left drag moves; Super + right drag resizes.
modifier = "super"
move_button = 1
resize_button = 3
# Set to zero to disable work-area edge snapping.
edge_resistance = 10
drag_threshold = 8
double_click_ms = 500

[[mouse.bindings]]
context = "client"
button = "Left"
trigger = "press"
action = { type = "focus" }

[[mouse.bindings]]
context = "client"
button = "Left"
trigger = "click"
action = { type = "raise" }

[[mouse.bindings]]
context = "titlebar"
button = "Left"
trigger = "press"
action = { type = "focus" }

[[mouse.bindings]]
context = "titlebar"
button = "Left"
trigger = "click"
action = { type = "raise" }

[[mouse.bindings]]
context = "titlebar"
button = "Left"
trigger = "drag"
action = { type = "move" }

[[mouse.bindings]]
context = "titlebar"
button = "Left"
trigger = "double_click"
action = { type = "toggle_maximize" }

[[mouse.bindings]]
context = "titlebar"
button = "Middle"
trigger = "click"
action = { type = "lower" }

[[mouse.bindings]]
context = "titlebar"
button = "Right"
trigger = "press"
actions = [
    { type = "focus" },
    { type = "raise" },
    { type = "show_menu", menu = "client" },
]

[[mouse.bindings]]
context = "border"
button = "Left"
trigger = "drag"
action = { type = "resize" }

[[mouse.bindings]]
context = "minimize"
button = "Left"
trigger = "click"
action = { type = "minimize" }

[[mouse.bindings]]
context = "maximize"
button = "Left"
trigger = "click"
action = { type = "toggle_maximize" }

[[mouse.bindings]]
context = "close"
button = "Left"
trigger = "click"
action = { type = "close" }

[[mouse.bindings]]
context = "desktop"
button = "Up"
trigger = "click"
action = { type = "previous_workspace" }

[[mouse.bindings]]
context = "desktop"
button = "Down"
trigger = "click"
action = { type = "next_workspace" }

[[mouse.bindings]]
context = "root"
button = "Right"
trigger = "press"
action = { type = "show_menu", menu = "root" }

[[mouse.bindings]]
context = "root"
button = "Middle"
trigger = "press"
action = { type = "show_menu", menu = "windows" }

[keyboard]
# Multi-step bindings such as "W-x t" expire after this delay. C-g cancels.
chain_quit_key = "C-g"
chain_timeout_ms = 3000

[[keyboard.bindings]]
key = "A-Tab"
action = { type = "next_window" }

[[keyboard.bindings]]
key = "A-S-Tab"
action = { type = "previous_window" }

# Optional spatial-focus bindings (uncomment to enable):
# [[keyboard.bindings]]
# key = "W-h"
# action = { type = "focus_direction", direction = "left" }
# [[keyboard.bindings]]
# key = "W-j"
# action = { type = "focus_direction", direction = "down" }
# [[keyboard.bindings]]
# key = "W-k"
# action = { type = "focus_direction", direction = "up" }
# [[keyboard.bindings]]
# key = "W-l"
# action = { type = "focus_direction", direction = "right" }
# Use `cycle_direction` with a modifier instead when an overlay and Escape
# cancellation are preferred, for example:
# [[keyboard.bindings]]
# key = "A-h"
# action = { type = "cycle_direction", direction = "left" }
# `raise_lower` is useful for a single adaptive stacking binding; legacy
# `shade_lower` and `unshade_raise` are also available as conditional actions.
# Focus action lists can combine `focus_to_bottom` with `unfocus`; the
# `focus_fallback` compatibility action has the same fallback behavior.
# Idempotent state actions include `maximize`/`unmaximize` with an optional
# `direction`, `decorate`/`undecorate`, `shade`/`unshade`, and `send_to_layer`
# with `layer = "below"`, `"normal"`, or `"above"`.
# Workspace lifecycle actions include `last_workspace`, `move_to_last_workspace`,
# and `add_workspace`/`remove_workspace` with optional `at = "current"`; the
# default insertion/removal position is `"last"`.
# `{ type = "restart" }` restarts nobox without rerunning autostart. Supplying
# `command = "openbox --replace"` instead performs a clean manager handoff.
# `if` and `for_each` use `query = [{ ... }]` with `then`/`else` action arrays;
# `for_each` also accepts `none`, and `stop` ends its current client iteration.

[[keyboard.bindings]]
key = "A-space"
action = { type = "show_menu", menu = "client" }

[[keyboard.bindings]]
key = "A-F11"
action = { type = "toggle_fullscreen" }

[[keyboard.bindings]]
key = "W-Return"
action = { type = "execute", command = "xterm" }

[[keyboard.bindings]]
key = "W-q"
action = { type = "close" }
# The stronger `{ type = "kill" }` action immediately disconnects an X11
# client; bind it only when bypassing WM_DELETE_WINDOW is intentional.

[[keyboard.bindings]]
key = "W-d"
action = { type = "toggle_show_desktop" }

[[keyboard.bindings]]
key = "W-S-Escape"
action = { type = "exit" }

[[keyboard.bindings]]
key = "W-Left"
action = { type = "workspace_left" }

[[keyboard.bindings]]
key = "W-Right"
action = { type = "workspace_right" }

[[keyboard.bindings]]
key = "W-Up"
action = { type = "workspace_up" }

[[keyboard.bindings]]
key = "W-Down"
action = { type = "workspace_down" }

[[keyboard.bindings]]
key = "W-S-Left"
action = { type = "move_to_workspace_left" }

[[keyboard.bindings]]
key = "W-S-Right"
action = { type = "move_to_workspace_right" }

[[keyboard.bindings]]
key = "W-S-Up"
action = { type = "move_to_workspace_up" }

[[keyboard.bindings]]
key = "W-S-Down"
action = { type = "move_to_workspace_down" }

# Application rules are evaluated in order when a window is first managed.
# Text fields use case-insensitive * and ? wildcards. Later matching rules can
# override individual settings from earlier matches.
#
# [[applications]]
# match = { class = "Firefox", kind = "normal" }
# workspace = 2
# layer = "normal"
# decorated = true
# focus = true
