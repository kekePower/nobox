[placement]
# Center inside a completely free smart-placement field, like Openbox.
center_free_space = true

[margins]
# Reserve space at the outer screen edges independently of panel struts.
top = 0
right = 0
bottom = 0
left = 0

[outputs]
# Direct Wayland sessions use automatic preferred modes and left-to-right
# layout unless exact connector rules are added as [[outputs.entries]].
# Each rule supports: name, enabled, mode = "WIDTHxHEIGHT@HZ",
# position = { x = 0, y = 0 }, transform, scale, and primary.
entries = []

[workspaces]
# The number of names is the number of workspaces.
names = ["1", "2", "3", "4"]
# Zero lays workspaces out in one row; set 2 for a 2x2 default grid.
columns = 0
# Default for custom directional actions. Standard keyboard navigation stops at
# grid edges; mouse-wheel navigation always wraps.
wrap = true
# One-based workspace selected unless saved session state restores another.
initial = 1

[theme]
border_width = 2
titlebar_height = 24
# X11 core font name or XLFD. Startup falls back to "fixed" when unavailable.
font = "-*-helvetica-medium-r-normal--12-*-*-*-p-*-iso10646-1"
title_alignment = "left"
title_padding = 8
# Graphite surfaces with a single steel-blue focus accent; red is reserved
# for close and urgency.
active_border = "#5e81a2"
inactive_border = "#2e3238"
urgent_border = "#a84c44"
active_titlebar = "#2d323b"
inactive_titlebar = "#1f2228"
urgent_titlebar = "#533029"
title_text = "#e2e6ec"
minimize_button = "#383e48"
maximize_button = "#383e48"
close_button = "#7d3b3b"
button_glyph = "#dfe3ea"

[mouse]
# Standard pointer bindings evolve with nobox. Entries below override a
# standard gesture with the same context, button, and trigger or add a custom one.
inherit_defaults = true
# Omit individual inherited gestures without copying the rest of the mouse map.
disabled_bindings = []
# Super is primary. Alt remains available for traditional WM compatibility.
modifier = "super"
compatibility_modifiers = ["alt"]
move_button = 1
resize_button = 3
# Keep nearby decorated window edges together while moving.
snap_to_windows = true
# Set to zero to disable all move and resize edge snapping.
edge_resistance = 10
drag_threshold = 8
double_click_ms = 500

[keyboard]
# Native Wayland sessions use these XKB names. Empty values defer to the
# XKB_DEFAULT_* environment; set layout explicitly when the display manager
# does not export a system keyboard layout.
model = ""
layout = ""
variant = ""
options = ""
# Standard bindings are supplied by nobox and evolve with it. Entries below
# override a standard binding with the same key or add a custom binding.
inherit_defaults = true
# Omit individual inherited bindings without copying the rest of the keymap.
disabled_bindings = []
# Multi-step bindings such as "W-x t" expire after this delay. C-g cancels.
chain_quit_key = "C-g"
chain_timeout_ms = 3000

# Optional spatial-focus bindings (uncomment to enable):
# [[keyboard.bindings]]
# key = "W-h"
# action = { type = "focus_direction", direction = "left" }
# [[keyboard.bindings]]
# key = "W-j"
# action = { type = "focus_direction", direction = "down" }
# [[keyboard.bindings]]
# key = "W-k"
# action = { type = "focus_direction", direction = "up" }
# [[keyboard.bindings]]
# key = "W-l"
# action = { type = "focus_direction", direction = "right" }
# Use `cycle_direction` with a modifier instead when an overlay and Escape
# cancellation are preferred, for example:
# [[keyboard.bindings]]
# key = "A-h"
# action = { type = "cycle_direction", direction = "left" }
# `raise_lower` is useful for a single adaptive stacking binding; legacy
# `shade_lower` and `unshade_raise` are also available as conditional actions.
# Focus action lists can combine `focus_to_bottom` with `unfocus`; the
# `focus_fallback` compatibility action has the same fallback behavior.
# Idempotent state actions include `maximize`/`unmaximize` with an optional
# `direction`, `decorate`/`undecorate`, `shade`/`unshade`, and `send_to_layer`
# with `layer = "below"`, `"normal"`, or `"above"`.
# Workspace lifecycle actions include `last_workspace`, `move_to_last_workspace`,
# and `add_workspace`/`remove_workspace` with optional `at = "current"`; the
# default insertion/removal position is `"last"`.
# `{ type = "restart" }` restarts nobox without rerunning autostart. Supplying
# `command = "openbox --replace"` instead performs a clean manager handoff.
# `session_logout` runs `commands.session` directly when configured. Otherwise
# it confirms by default, requests logout from XSMP when connected, and falls
# back to a clean local exit. Set `prompt = false` only when a separate trusted
# confirmation layer already exists.
# `exit` also confirms by default, but deliberately exits only nobox rather than
# asking the surrounding desktop session to end.
# `if` and `for_each` use `query = [{ ... }]` with `then`/`else` action arrays;
# `for_each` also accepts `none`, and `stop` ends its current client iteration.
# `debug` writes a bounded `message` to nobox's structured runtime log.

# The stronger `{ type = "kill" }` action immediately disconnects an X11
# client; bind it only when bypassing WM_DELETE_WINDOW is intentional.
# Add `strict = true` to keep newly mapped ordinary windows hidden until the
# mode is explicitly toggled or an activation request selects a client.

# Application rules are evaluated in order when a window is first managed.
# Text fields use case-insensitive * and ? wildcards. Later matching rules can
# override individual settings from earlier matches.
#
# [[applications]]
# match = { class = "Firefox", kind = "normal" }
# workspace = 2
# layer = "normal"
# decorated = true
# focus = true
# minimized = false
# shaded = false
# skip_pager = false
# skip_taskbar = false
# fullscreen = false
# maximized = "both" # none, horizontal, vertical, or both; booleans also work
# position = { x = "center", y = 40, output = "pointer", force = false }
# size = { width = "75%", height = 900, width_basis = "outer", height_basis = "content" }

# WM-mediated agent access is off, and no socket exists, unless enabled here.
# See docs/agent-protocol.md. A grant binds to the companion's executable path,
# never to the name a connecting process declares about itself, and confers
# exactly the capabilities it lists: bundles (observe, accessibility, capture,
# input, manage, launch) or single atoms such as manage.activate. Anything not listed is
# refused. `scope` restricts a grant to matching clients, which are then the
# only clients that session can see at all.
#
# [agent]
# enabled = false
# socket = "" # empty uses $XDG_RUNTIME_DIR/nobox/agent-seat-<display>.sock
#
# [[agent.grants]]
# label = "my harness"
# executable = "/usr/bin/nobox-agent"
# uid = 1000
# capabilities = ["observe", "accessibility", "manage.activate"]
# scope = { class = "Firefox" }
#
# Launching runs installed code, so it starts closed and opens only as written.
#
# [agent.launch]
# policy = "deny" # deny, allow_listed, or allow_installed
# allow = ["org.example.Editor.desktop"]
# deny = []
# user_entries = false # user-installed entries stay unlaunchable by default
#
# Individual applications can be hidden from agents entirely. A hidden client
# is absent from every response and event, and acting on its identity returns
# the same answer as a client that never existed.
#
# [[applications]]
# match = { class = "Keepassxc" }
# agent_visibility = "hidden" # visible, redacted, or hidden
