[package]
name = "nobox-settings"
description = "Validated graphical configuration editor for nobox"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.1.5"

[features]
default = []
gui = ["dep:adw", "dep:gtk", "dep:nobox-x11"]

[dependencies]
adw = { package = "libadwaita", version = "0.7.2", features = ["v1_5"], optional = true }
clap.workspace = true
gtk = { package = "gtk4", version = "0.9.7", features = ["v4_10"], optional = true }
nobox-config = { path = "../nobox-config" }
nobox-desktop = { path = "../nobox-desktop" }
nobox-x11 = { path = "../nobox-x11", optional = true }

[[bin]]
name = "nobox-settings"
path = "src/main.rs"
required-features = ["gui"]

[lints]
workspace = true
