<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Nobox Semantic Video Fixture</title>

  body { margin: 0; font: 24px sans-serif; }
  main { padding: 48px; }
  [role="group"], video {
    display: block;
    width: 640px;
    height: 360px;
  }

  video { background: #18202a; }
</style>
<main>
  <h1>Semantic video fixture</h1>

  </figure>
