[workspace]
members = [
    "crates/agent-seat-proto",
    "crates/nobox",
    "crates/nobox-agent",
    "crates/nobox-config",
    "crates/nobox-core",
    "crates/nobox-desktop",
    "crates/nobox-panel",
    "crates/nobox-settings",
    "crates/nobox-x11",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-2.0-only"
repository = "https://git.kekepower.com/kekePower/nobox"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
agent-seat-proto = { path = "crates/agent-seat-proto", version = "0.1.0" }
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
png = "0.18.1"
rustix = { version = "1.1.4", default-features = false, features = ["net", "process", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
signal-hook = { version = "0.4.4", default-features = false, features = ["iterator"] }
thiserror = "2.0.19"
toml = "1.1.4"
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x11rb = { version = "0.13.2", features = ["composite", "randr", "shape", "sync", "xinput", "xtest"] }
xkeysym = "0.2.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
