[workspace]
members = [
    "crates/agent-semantic-helper",
    "crates/nobox-agent-wire",
    "crates/nobox",
    "crates/nobox-agent",
    "crates/nobox-config",
    "crates/nobox-core",
    "crates/nobox-desktop",
    "crates/nobox-panel",
    "crates/nobox-runtime",
    "crates/nobox-settings",
    "crates/nobox-wayland",
    "crates/nobox-x11",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/kekePower/nobox"
rust-version = "1.87"
version = "0.2.0"

[workspace.dependencies]
nobox-agent-wire = { path = "crates/nobox-agent-wire", version = "0.2.1" }
nobox-core = { path = "crates/nobox-core", version = "0.2.0" }
nobox-config = { path = "crates/nobox-config", version = "0.2.0" }
nobox-desktop = { path = "crates/nobox-desktop", version = "0.2.0" }
nobox-runtime = { path = "crates/nobox-runtime", version = "0.2.5" }
smithay = { version = "=0.7.0", default-features = false, features = ["backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "backend_winit", "desktop", "renderer_gl", "renderer_multi", "renderer_pixman", "use_system_lib", "wayland_frontend"] }
async-io = "2.6.0"
atspi = { version = "0.30.0", default-features = false, features = ["connection", "proxies"] }
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
futures-lite = "2.6.1"
fontdb = "0.23.0"
fontdue = "0.9.4"
png = "0.18.1"
rustix = { version = "1.1.4", default-features = false, features = ["net", "process", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
signal-hook = { version = "0.4.4", default-features = false, features = ["iterator"] }
thiserror = "2.0.19"
toml = "1.1.4"
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-protocols = { version = "0.32.13", features = ["client", "server", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.13.2", features = ["composite", "randr", "res", "shape", "sync", "xinput", "xtest"] }
xkeysym = "0.2.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
